migracion_legado:
  post:
    summary: Ingesta y saneamiento de datos del sistema legado de almacén
    description: >
      Procesa el lote histórico de clientes y productos del almacén informal,
      aplicando reglas de saneamiento (algoritmo Módulo 11 en RUC, homologación
      a unidades del Catálogo 03 y asignación de afectación de IGV).
    operationId: migrarDatosLegado
    tags:
      - Migración
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/MigracionLegado.yaml'
    responses:
      '201':
        description: Lote de migración procesado con éxito.
        content:
          application/json:
            schema:
              $ref: '../schemas/MigracionResponse.yaml'
      '400':
        description: Errores de validación en la estructura del lote.
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
