type: object
required:
  - tipoDocumentoIdentidad
  - numeroDocumentoIdentidad
  - razonSocial
  - direccionFiscal
  - ubigeo
properties:
  tipoDocumentoIdentidad:
    type: string
    description: >
      Tipo de Documento de Identidad del adquirente según Catálogo 06 de SUNAT.
      '6' = Registro Único de Contribuyentes (RUC) - Requisito estricto para Facturas Electrónicas (Tipo 01).
      '1' = Documento Nacional de Identidad (DNI)
      '4' = Carnet de Extranjería
      '7' = Pasaporte
      'A' = Cédula Diplomática de Identidad
    enum: ["6", "1", "4", "7", "A"]
    example: "6"
  numeroDocumentoIdentidad:
    type: string
    description: Número de RUC o documento oficial de identidad (11 dígitos para RUC con validación de algoritmo Módulo 11 de SUNAT).
    minLength: 8
    maxLength: 15
    example: "20601234567"
  razonSocial:
    type: string
    description: Razón Social o denominación oficial registrada en el padrón tributario de SUNAT.
    minLength: 3
    maxLength: 150
    example: "DISTRIBUIDORA LOGISTICA DEL CENTRO S.A.C."
  nombreComercial:
    type: string
    maxLength: 100
    description: Nombre comercial del adquirente si lo tuviera.
    example: "LOGISTICA DEL CENTRO"
  direccionFiscal:
    type: string
    description: Domicilio fiscal completo del adquirente.
    maxLength: 200
    example: "Av. Industrial 450, Urb. Vulcano, Ate, Lima"
  ubigeo:
    type: string
    pattern: '^[0-9]{6}$'
    description: Código de Ubigeo INEI / SUNAT de 6 dígitos numéricos (Departamento/Provincia/Distrito).
    example: "150103"
  departamento:
    type: string
    description: Nombre del departamento.
    example: "LIMA"
  provincia:
    type: string
    description: Nombre de la provincia.
    example: "LIMA"
  distrito:
    type: string
    description: Nombre del distrito.
    example: "ATE"
  correoElectronico:
    type: string
    format: email
    description: Correo electrónico para el envío automático del XML UBL 2.1 y la representación impresa PDF.
    example: "contabilidad@logisticadelcentro.pe"
  telefono:
    type: string
    example: "+51 987654321"
