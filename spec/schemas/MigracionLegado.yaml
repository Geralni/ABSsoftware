type: object
required:
  - loteId
  - origen
  - clientes
  - productos
properties:
  loteId:
    type: string
    description: Identificador único del lote de migración del almacén informal.
    example: "LOTE-MIG-202610-01"
  origen:
    type: string
    description: Identificador del sistema informal o base de datos previa.
    example: "ALMACEN_INFORMAL_DBF"
  aplicarSaneamientoEstricto:
    type: boolean
    default: true
    description: Si es true, valida RUCs con algoritmo Módulo 11 y descarta caracteres inválidos en descripciones.
    example: true
  clientes:
    type: array
    items:
      type: object
      required:
        - idLegado
        - razonSocial
        - numeroDocumentoIdentidad
      properties:
        idLegado:
          type: string
          example: "CLI-0012"
        razonSocial:
          type: string
          example: "FERRETERIA CENTRAL S.R.L."
        tipoDocumentoIdentidadLegado:
          type: string
          description: Tipo de documento en el almacén antiguo (se homologará a '6' RUC o '1' DNI según Catálogo 06).
          example: "RUC"
        numeroDocumentoIdentidad:
          type: string
          description: Número de RUC o documento del cliente antiguo.
          example: "20489912341"
        direccionFiscal:
          type: string
          example: "Jr. Ayacucho 452, Huancayo"
        ubigeo:
          type: string
          example: "120101"
  productos:
    type: array
    items:
      type: object
      required:
        - idLegado
        - descripcion
        - precioVentaSinIgv
      properties:
        idLegado:
          type: string
          example: "ART-501"
        descripcion:
          type: string
          example: "CABLE ELECTRICO VULCANIZADO 2X14"
        unidadMedidaLegado:
          type: string
          description: Unidad empírica del almacén antiguo (ej. 'unid', 'mtr') a homologar con Catálogo 03 de SUNAT.
          example: "MTR"
        precioVentaSinIgv:
          type: number
          format: double
          description: Valor de venta histórico sin IGV.
          example: 45.50
        stockActual:
          type: number
          example: 120
        codigoAfectacionIgvSugerida:
          type: string
          description: Código de Afectación sugerido según Catálogo 07 de SUNAT ('10' para Gravado).
          example: "10"
