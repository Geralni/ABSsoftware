type: object
properties:
  batchId:
    type: string
    example: "LOTE-MIG-202610-01"
  totalCustomersProcessed:
    type: integer
    example: 150
  totalCustomersMigrated:
    type: integer
    example: 146
  totalCustomersRejected:
    type: integer
    example: 4
  totalProductsProcessed:
    type: integer
    example: 820
  totalProductsMigrated:
    type: integer
    example: 818
  totalProductsRejected:
    type: integer
    example: 2
  sanitizationErrors:
    type: array
    items:
      type: object
      properties:
        entity:
          type: string
          example: "Customer"
        legacyId:
          type: string
          example: "CLI-0089"
        reason:
          type: string
          example: "RUC '2010001' does not contain 11 digits or fails SUNAT Modulo 11 check digit verification."
  status:
    type: string
    example: "MIGRATION_COMPLETED_WITH_WARNINGS"
