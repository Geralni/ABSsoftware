type: object
required:
  - ublVersionId
  - customizationId
  - tipoComprobante
  - serie
  - correlativo
  - fechaEmision
  - horaEmision
  - codigoMoneda
  - tipoOperacion
  - rucEmisor
  - razonSocialEmisor
  - ubigeoEmisor
  - cliente
  - detalles
  - formaPago
properties:
  ublVersionId:
    type: string
    description: Versión del estándar UBL exigida por SUNAT. Valor fijo obligatorio '2.1'. Mapea a <cbc:UBLVersionID>.
    enum: ["2.1"]
    example: "2.1"
  customizationId:
    type: string
    description: Versión de la estructura del documento según SUNAT. Valor fijo obligatorio '2.0'. Mapea a <cbc:CustomizationID>.
    enum: ["2.0"]
    example: "2.0"
  tipoComprobante:
    type: string
    description: Código de Tipo de Comprobante de Pago según Catálogo 01 de SUNAT ('01' = Factura Electrónica).
    enum: ["01"]
    example: "01"
  serie:
    type: string
    pattern: '^[F][A-Z0-9]{3}$'
    description: Serie alfanumérica de 4 caracteres. Para Facturas debe iniciar obligatoriamente con la letra 'F'.
    example: "F001"
  correlativo:
    type: integer
    minimum: 1
    maximum: 99999999
    description: Número correlativo secuencial de 1 a 8 dígitos numéricos.
    example: 123
  fechaEmision:
    type: string
    format: date
    description: Fecha de emisión en formato YYYY-MM-DD. Plazo máximo de hasta 3 días calendario anteriores a la fecha de remisión a SUNAT.
    example: "2026-10-22"
  horaEmision:
    type: string
    pattern: '^([01]\d|2[0-3]):([0-5]\d):([0-5]\d)$'
    description: Hora de emisión en formato militar HH:MM:SS (ISO 8601).
    example: "10:15:30"
  fechaVencimiento:
    type: string
    format: date
    description: Fecha de vencimiento para operaciones al crédito (RS 193-2020/SUNAT).
    example: "2026-11-21"
  codigoMoneda:
    type: string
    description: Código internacional de la moneda según Catálogo 02 de SUNAT ('PEN' = Soles, 'USD' = Dólares Americanos).
    enum: ["PEN", "USD", "EUR"]
    example: "PEN"
  tipoOperacion:
    type: string
    description: Código de Tipo de Operación comercial según Catálogo 51 de SUNAT ('0101' = Venta Interna).
    example: "0101"
  rucEmisor:
    type: string
    pattern: '^(10|20)[0-9]{9}$'
    description: RUC de 11 dígitos de la empresa emisora (ABC Software Corp) validado con algoritmo Módulo 11.
    example: "20123456789"
  razonSocialEmisor:
    type: string
    description: Razón social oficial de la empresa emisora registrada ante SUNAT.
    example: "ABC SOFTWARE CORP S.A.C."
  nombreComercialEmisor:
    type: string
    example: "ABC SOFTWARE"
  ubigeoEmisor:
    type: string
    pattern: '^[0-9]{6}$'
    description: Código de Ubigeo del domicilio fiscal del emisor según Catálogo INEI / SUNAT.
    example: "150131"
  direccionFiscalEmisor:
    type: string
    description: Domicilio fiscal completo del local principal del emisor.
    example: "Av. Las Camelias 820, San Isidro, Lima, Lima"
  cliente:
    $ref: './Cliente.yaml'
  formaPago:
    type: object
    required:
      - tipo
      - montoNetoPendiente
    properties:
      tipo:
        type: string
        enum: ["Contado", "Credito"]
        example: "Contado"
      montoNetoPendiente:
        type: number
        format: double
        description: Monto neto pendiente de pago (0.00 en operaciones al Contado).
        example: 0.00
      cuotas:
        type: array
        description: Detalle de cuotas obligatorio para ventas al Crédito según RS 193-2020/SUNAT.
        items:
          type: object
          required:
            - numeroCuota
            - monto
            - fechaVencimiento
          properties:
            numeroCuota:
              type: integer
              example: 1
            monto:
              type: number
              format: double
              example: 177.00
            fechaVencimiento:
              type: string
              format: date
              example: "2026-11-22"
  detalles:
    type: array
    minItems: 1
    items:
      $ref: './DetalleFactura.yaml'
  observaciones:
    type: string
    maxLength: 500
    example: "Condición de entrega en almacén central"
