type: object
required:
  - code
  - message
  - timestamp
properties:
  code:
    type: string
    description: Internal error code or official SUNAT exception code (e.g., 'SUNAT_2014').
    example: "VALIDATION_ERROR_SUNAT"
  message:
    type: string
    description: Human-readable technical description of the error.
    example: "Customer RUC does not comply with the SUNAT Modulo 11 checksum algorithm."
  details:
    type: array
    items:
      type: string
    example: ["Field 'items[0].igvTaxExemptionCode' is mandatory and must match SUNAT Catalog 07."]
  timestamp:
    type: string
    format: date-time
    example: "2026-10-22T10:15:35Z"
