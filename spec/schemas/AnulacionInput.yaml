type: object
required:
  - motivo
  - codigoMotivo
properties:
  motivo:
    type: string
    minLength: 10
    maxLength: 100
    description: Sustento del motivo de anulación según normativa SUNAT.
    example: "Error en el RUC del cliente y descripción de ítems"
  codigoMotivo:
    type: string
    description: Código del motivo de anulación según Catálogo 09 de SUNAT ('01' = Anulación de la operación).
    enum: ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10"]
    example: "01"
