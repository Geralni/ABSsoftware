type: object
required:
  - reason
  - reasonCode
properties:
  reason:
    type: string
    minLength: 10
    maxLength: 100
    description: Formal explanation and legal justification for voiding the invoice according to SUNAT rules.
    example: "Error in customer RUC and item catalog description"
  reasonCode:
    type: string
    description: Voiding or credit note motive code according to SUNAT Catalog 09 ('01' = Anulación de la operación).
    enum: ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10"]
    example: "01"
