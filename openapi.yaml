openapi: 3.0.3
info:
  title: ABC Software Corp - SUNAT UBL 2.1 Electronic Invoicing API
  description: >
    REST API for the issuance, voiding, consultation, and migration of electronic
    invoicing documents compliant with Peruvian tax regulations (SUNAT) and the
    OASIS UBL 2.1 standard (`UBL-Invoice-2.1.xsd`). Built to serve cross-platform
    native clients on Windows (.MSI) and Android (.APK).
  version: 1.0.0
  contact:
    name: Software Architecture Team - ABC Software Corp
    email: architecture@abcsoftware.pe

servers:
  - url: https://api.abcsoftware.pe/api/v1
    description: Production Central Server
  - url: https://api-qa.abcsoftware.pe/api/v1
    description: QA / Staging Environment (SUNAT Beta / Homologation)
  - url: http://localhost:8000/api/v1
    description: Local Development / In-Store POS Monolith

paths:
  /invoices:
    $ref: './spec/paths/invoices.yaml#/invoices'
  /invoices/{id}:
    $ref: './spec/paths/invoices.yaml#/invoices_id'
  /invoices/{id}/xml:
    $ref: './spec/paths/invoices.yaml#/invoices_id_xml'
  /invoices/{id}/void:
    $ref: './spec/paths/invoices.yaml#/invoices_id_void'
  /migration/legacy:
    $ref: './spec/paths/migration.yaml#/migration_legacy'

components:
  schemas:
    Customer:
      $ref: './spec/schemas/Customer.yaml'
    InvoiceItem:
      $ref: './spec/schemas/InvoiceItem.yaml'
    InvoiceInput:
      $ref: './spec/schemas/InvoiceInput.yaml'
    InvoiceResponse:
      $ref: './spec/schemas/InvoiceResponse.yaml'
    VoidInvoiceInput:
      $ref: './spec/schemas/VoidInvoiceInput.yaml'
    VoidInvoiceResponse:
      $ref: './spec/schemas/VoidInvoiceResponse.yaml'
    LegacyMigrationInput:
      $ref: './spec/schemas/LegacyMigrationInput.yaml'
    LegacyMigrationResponse:
      $ref: './spec/schemas/LegacyMigrationResponse.yaml'
    ErrorResponse:
      $ref: './spec/schemas/ErrorResponse.yaml'
